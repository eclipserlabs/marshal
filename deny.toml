# cargo-deny configuration.
#
# The point of this file in a crate like this one: a security tool inherits the
# security of its dependency tree, and "we run cargo audit" was not true while
# the job was `continue-on-error`.

[advisories]
yanked = "deny"
# Advisories to accept, each with a reason and a link. Empty is the goal.
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
# Permissive licenses only. Anything copyleft in the tree is a decision someone
# should make deliberately, not discover at release time.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# `watchdog` is an optional dependency behind the `container` feature, pinned to
# a revision rather than a branch. It is not published, which is a release
# blocker for shipping that feature to anyone else — tracked in ROADMAP.md.
allow-git = ["https://github.com/wiramahendra/watchdog"]
